<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bengaluru Wards Comparison Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #map-container {
      display: grid;
      width: 100vw;
      height: calc(100vh - 70px);
      min-height: 0;
      overflow: hidden;
      grid-gap: 2px;
      background: #111;
      /* Default: 2 maps side by side */
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .map-section {
      min-width: 0;
      min-height: 0;
      position: relative;
      border: none;
      border-radius: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #f8f8f8;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    .map {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      border-radius: 0;
      overflow: hidden;
    }
    .split-btn {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.95em;
    }
    @media (max-width: 900px) {
      #map-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;
        height: calc(100vh - 70px);
      }
      .map-section {
        min-width: 0;
        min-height: 0;
      }
    }

  </style>
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 16px; margin-bottom: 8px; gap: 12px; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto;">
  <h2 style="margin: 0 12px 0 0; flex-shrink: 0;">Bengaluru Wards & Zones Comparison Map</h2>
    <div id="search-bar-container" style="margin-left: auto; position: relative; min-width: 260px; max-width: 420px; width: 100%; display: flex; align-items: center; gap: 6px;">
      <input id="location-search" type="text" placeholder="Search ward, village, or settlement..." style="flex:1; padding: 7px 10px; font-size: 1em; border: 1.5px solid #bbb; border-radius: 4px; outline: none;" autocomplete="off">
      <div id="autocomplete-list" style="position: absolute; left: 0; top: 100%; z-index: 1000; background: #fff; border: 1px solid #ccc; border-radius: 0 0 4px 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 100%; display: none;"></div>
    </div>

  <div style="display: flex; gap: 6px; margin-left: 16px;">
      <button id="btn-1x2" class="split-btn" title="1x2 Grid" style="padding: 2px 6px; display: flex; align-items: center;">
        <svg width="28" height="20" viewBox="0 0 28 20"><rect x="2" y="2" width="10" height="16" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/><rect x="16" y="2" width="10" height="16" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/></svg>
      </button>
      <button id="btn-2x2" class="split-btn" title="2x2 Grid" style="padding: 2px 6px; display: flex; align-items: center;">
        <svg width="28" height="20" viewBox="0 0 28 20"><rect x="2" y="2" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/><rect x="16" y="2" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/><rect x="2" y="11" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/><rect x="16" y="11" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#222" stroke-width="1.5"/></svg>
      </button>
    </div>
  </div>
  <div id="map-container"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://jieter.github.io/Leaflet.Sync/L.Map.Sync.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script>
    // Layer config for search/autocomplete
    const LAYER_OPTIONS = [
      { label: 'New GBA Wards', url: 'geojson/gba_wards.geojson', color: 'green', searchField: 'ward_name' },
      { label: 'BBMP Wards', url: 'geojson/bbmp_wards.geojson', color: 'blue', searchField: 'Ward Name (en)' },
      { label: 'Villages', url: 'geojson/villages.geojson', color: 'orange', searchField: 'Village Name' },
      { label: 'Settlements', url: 'geojson/bbmp_settlements.geojson', color: 'purple', searchField: 'KGISVill_2' },
      { label: 'GBA Zones', url: 'geojson/zones.geojson', color: 'red', searchField: null } // Not searchable
    ];

    // --- Search/autocomplete logic ---
    const SEARCHABLE_LAYERS = LAYER_OPTIONS.filter(l => l.searchField);
    let searchIndex = [];

    async function buildSearchIndex() {
      searchIndex = [];
      for (const layer of SEARCHABLE_LAYERS) {
        try {
          const resp = await fetch(layer.url);
          if (!resp.ok) continue;
          const data = await resp.json();
          if (!data.features) continue;
          for (const feat of data.features) {
            const val = feat.properties[layer.searchField];
            if (val && typeof val === 'string' && val.trim().length > 0) {
              searchIndex.push({
                label: val.trim(),
                layerLabel: layer.label,
                layerIdx: LAYER_OPTIONS.indexOf(layer),
                feature: feat
              });
            }
          }
        } catch (e) { console.warn('Error loading for search index:', layer.label, e); }
      }
      // Sort alphabetically
      searchIndex.sort((a, b) => a.label.localeCompare(b.label));
    }

    // --- Autocomplete UI logic ---
    const searchInput = document.getElementById('location-search');
    const autocompleteList = document.getElementById('autocomplete-list');
    let currentFocus = -1;

    function closeAutocomplete() {
      autocompleteList.style.display = 'none';
      autocompleteList.innerHTML = '';
      currentFocus = -1;
    }

    function highlightFeatureOnMaps(selected) {
      mapSections.forEach((ms) => {
        // Map 0: multi-layer
        if (ms.index === 0 && Array.isArray(ms.geoLayers) && ms.geoLayers.length > 0) {
          if (ms.loadedLayers && ms.loadedLayers.includes(selected.layerIdx)) {
            highlightFeatureInMultiLayers(ms, selected);
          }
        } else if (ms.index !== 0 && ms.geoLayer) {
          // For other maps, check if the loadedLayer matches the selected layerIdx
          if (typeof ms.loadedLayer === 'number' && ms.loadedLayer === selected.layerIdx) {
            highlightFeatureInLayer(ms, selected);
          }
        }
      });
    }

    function highlightFeatureInMultiLayers(ms, selected) {
      // Find the geoLayer in ms.geoLayers that matches selected.layerIdx
      const field = LAYER_OPTIONS[selected.layerIdx].searchField;
      const selectedVal = (selected.feature.properties[field] || '').toString().trim().toLowerCase();
      ms.geoLayers.forEach((geoLayer, i) => {
        // Only check the correct layer
        // We don't have a direct reference to which geoLayer is for which layerIdx, so check a feature property
        let found = false;
        geoLayer.eachLayer(layer => {
          if (!layer.feature) return;
          if (layer.feature.properties && selected.feature.properties) {
            const layerVal = (layer.feature.properties[field] || '').toString().trim().toLowerCase();
            if (field && layerVal === selectedVal) {
              // Zoom to feature
              if (!found) {
                if (layer.getBounds) {
                  ms.map.fitBounds(layer.getBounds(), { maxZoom: 16 });
                } else if (layer.getLatLng) {
                  ms.map.setView(layer.getLatLng(), 16);
                }
                found = true;
              }
              // Flash/highlight: set style, open popup
              if (layer.setStyle) {
                layer.setStyle({ color: '#ff6600', weight: 4, fillOpacity: 0.3 });
                setTimeout(() => {
                  layer.setStyle({ color: LAYER_OPTIONS[selected.layerIdx].color, weight: 2, fillOpacity: 0.1 });
                }, 1800);
              }
              if (layer.openPopup) {
                layer.openPopup();
              }
            }
          }
        });
      });
    }

    function highlightFeatureInLayer(ms, selected) {
      if (!ms.geoLayer) return;
      const field = LAYER_OPTIONS[selected.layerIdx].searchField;
      const selectedVal = (selected.feature.properties[field] || '').toString().trim().toLowerCase();
      ms.geoLayer.eachLayer(layer => {
        if (!layer.feature) return;
        if (layer.feature.properties && selected.feature.properties) {
          const layerVal = (layer.feature.properties[field] || '').toString().trim().toLowerCase();
          if (field && layerVal === selectedVal) {
            // Zoom to feature
            if (layer.getBounds) {
              ms.map.fitBounds(layer.getBounds(), { maxZoom: 16 });
            } else if (layer.getLatLng) {
              ms.map.setView(layer.getLatLng(), 16);
            }
            // Flash/highlight: set style, open popup
            if (layer.setStyle) {
              layer.setStyle({ color: '#ff6600', weight: 4, fillOpacity: 0.3 });
              setTimeout(() => {
                layer.setStyle({ color: LAYER_OPTIONS[selected.layerIdx].color, weight: 2, fillOpacity: 0.1 });
              }, 1800);
            }
            if (layer.openPopup) {
              layer.openPopup();
            }
          }
        }
      });
    }

    function showAutocomplete(val) {
      closeAutocomplete();
      if (!val || val.length < 2) return;
      const matches = searchIndex.filter(item => item.label.toLowerCase().includes(val.toLowerCase()));
      if (matches.length === 0) return;
      autocompleteList.style.display = 'block';
      autocompleteList.innerHTML = '';
      matches.slice(0, 12).forEach((item, idx) => {
        const div = document.createElement('div');
        div.style.padding = '7px 12px';
        div.style.cursor = 'pointer';
        div.style.borderBottom = '1px solid #eee';
        div.innerHTML = `<span style="font-weight:600">${item.label}</span> <span style="color:#888;font-size:0.95em;">(${item.layerLabel})</span>`;
        div.onmousedown = (e) => {
          e.preventDefault();
          searchInput.value = item.label;
          closeAutocomplete();
          highlightFeatureOnMaps(item);
        };
        autocompleteList.appendChild(div);
      });
    }

    searchInput.addEventListener('input', function(e) {
      showAutocomplete(this.value);
    });

    searchInput.addEventListener('keydown', function(e) {
      let items = autocompleteList.getElementsByTagName('div');
      if (e.key === 'ArrowDown') {
        currentFocus++;
        if (currentFocus >= items.length) currentFocus = 0;
        setActive(items);
      } else if (e.key === 'ArrowUp') {
        currentFocus--;
        if (currentFocus < 0) currentFocus = items.length - 1;
        setActive(items);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentFocus > -1 && items[currentFocus]) {
          items[currentFocus].dispatchEvent(new MouseEvent('mousedown'));
        }
      }
    });

    function setActive(items) {
      for (let i = 0; i < items.length; i++) {
        items[i].style.background = '#fff';
      }
      if (currentFocus > -1 && items[currentFocus]) {
        items[currentFocus].style.background = '#e3f0ff';
        items[currentFocus].scrollIntoView({ block: 'nearest' });
      }
    }

    document.addEventListener('click', function(e) {
      if (e.target !== searchInput) closeAutocomplete();
    });

    // Call on page load
    buildSearchIndex();

    // Map state
  let mapSections = [];
  const maxSections = 4;

    // Initial center (Bengaluru)
    const initialCenter = [12.9716, 77.5946];
    const initialZoom = 11;

    function createMapSection(idx) {
      const section = document.createElement('div');
      section.className = 'map-section';
      section.id = `map-section-${idx}`;

      // Map div
      const mapDiv = document.createElement('div');
      mapDiv.className = 'map';
      mapDiv.id = `map${idx}`;
      section.appendChild(mapDiv);

      return section;
    }

    // Dynamically update grid layout based on map count
    function updateGridLayout() {
      const container = document.getElementById('map-container');
      const count = mapSections.length;
      if (count === 2) {
        container.style.gridTemplateColumns = '1fr 1fr';
        container.style.gridTemplateRows = '1fr';
      } else if (count === 3) {
        container.style.gridTemplateColumns = '1fr 1fr';
        container.style.gridTemplateRows = '1fr 1fr';
      } else if (count === 4) {
        container.style.gridTemplateColumns = '1fr 1fr';
        container.style.gridTemplateRows = '1fr 1fr';
      }
    }

    function addMapSection() {
      if (mapSections.length >= maxSections) return;
      const idx = mapSections.length;
      const section = createMapSection(idx);
      document.getElementById('map-container').appendChild(section);
      updateGridLayout();
      // Create Leaflet map
      const map = L.map(`map${idx}`, {
        center: initialCenter,
        zoom: initialZoom,
        zoomControl: idx === 0, // Only first map has zoom control
        scrollWheelZoom: true
      });
      // OSM base
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19,
        opacity: 0.85
      }).addTo(map);


      // --- Multi-layer logic for map 0 ---
      // Add multi-select dropdown as a Leaflet control for map 0
      if (idx === 0) {
        const MultiLayerDropdown = L.Control.extend({
          options: { position: 'topright' },
          onAdd: function() {
            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            container.style.background = '#fff';
            container.style.padding = '4px 8px';
            container.style.margin = '6px 0 0 0';
            container.style.borderRadius = '6px';
            container.style.boxShadow = '0 2px 8px rgba(0,0,0,0.07)';
            container.style.display = 'flex';
            container.style.alignItems = 'center';
            const label = document.createElement('label');
            label.textContent = 'Layers: ';
            label.style.fontWeight = 'bold';
            label.style.fontSize = '0.98em';
            label.style.marginRight = '6px';
            container.appendChild(label);
            const select = document.createElement('select');
            select.id = 'multi-layer-select';
            select.multiple = true;
            select.size = Math.min(LAYER_OPTIONS.length, 5);
            select.style.minWidth = '140px';
            select.style.fontSize = '1em';
            select.style.padding = '2px 6px';
            select.style.border = '1.5px solid #bbb';
            select.style.borderRadius = '4px';
            select.style.background = '#fff';
            select.style.marginBottom = '0';
            LAYER_OPTIONS.forEach((opt, i) => {
              const option = document.createElement('option');
              option.value = i;
              option.textContent = opt.label;
              select.appendChild(option);
            });
            container.appendChild(select);
            L.DomEvent.disableClickPropagation(container);
            // Attach event listener here so it works after layout changes
            setTimeout(() => {
              const selectEl = document.getElementById('multi-layer-select');
              if (selectEl) {
                selectEl.addEventListener('change', function() {
                  const selected = Array.from(selectEl.selectedOptions).map(opt => parseInt(opt.value)).filter(v => !isNaN(v));
                  const ms0 = mapSections[0];
                  if (ms0 && ms0.map && typeof ms0.index === 'number' && ms0.index === 0) {
                    ms0.loadedLayers = selected;
                    ms0.geoLayers = ms0.geoLayers || [];
                    ms0.geoLayers.forEach(l => ms0.map.removeLayer(l));
                    ms0.geoLayers = [];
                    if (selected.length > 0) {
                      if (typeof window.loadLayersMultiMap0 === 'function') {
                        window.loadLayersMultiMap0(selected);
                      }
                    } else {
                      ms0.geoLayers = [];
                    }
                  }
                });
              }
            }, 0);
            return container;
          }
        });
        map.addControl(new MultiLayerDropdown());
      }
      let geoLayers = [];
      // For map 0, support multiple layers
      function loadLayersMulti(selectedLayerIdxs) {
        // Remove all previous layers
        geoLayers.forEach(l => map.removeLayer(l));
        geoLayers = [];
        if (!selectedLayerIdxs || selectedLayerIdxs.length === 0) {
          updateDebugStatus('No layer loaded. Please select one or more layers.');
          return;
        }
        let loadedCount = 0;
        selectedLayerIdxs.forEach(layerIdx => {
          const opt = LAYER_OPTIONS[layerIdx];
          updateDebugStatus(`Loading ${opt.label}...`);
          fetch(opt.url)
            .then(r => {
              if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
              return r.json();
            })
            .then(data => {
              if (!data || !data.features || data.features.length === 0) {
                updateDebugStatus(`Warning: No features in ${opt.label}`);
                L.popup()
                  .setLatLng(initialCenter)
                  .setContent(`<div style="color:orange">⚠️ No features found in ${opt.label}</div>`)
                  .openOn(map);
              } else {
                updateDebugStatus(`Loaded ${opt.label}: ${data.features.length} features`);
              }
              const geoLayer = L.geoJSON(data, {
                style: { color: opt.color, weight: 2, fillOpacity: 0.1 },
                onEachFeature: (feature, layer) => {
                  const title = opt.label;
                  let props = Object.entries(feature.properties).map(([k,v]) => `<b>${k}</b>: ${v}`).join('<br>');
                  const content = `<h4 style=\"margin:0 0 5px 0;font-size:14px;color:${opt.color}\">${title}</h4>${props}`;
                  layer.bindPopup(content);
                  layer.on('click', function(e) {
                    L.DomEvent.stopPropagation(e);
                    const latlng = e.latlng;
                    updateDebugStatus(`Clicked: ${feature.properties.ward_name || feature.properties.id || 'feature'}`);
                    mapSections.forEach((ms) => {
                      if (ms.map !== map) {
                        ms.map.fire('external-feature-click', { latlng });
                      }
                    });
                  });
                }
              }).addTo(map);
              geoLayers.push(geoLayer);
              loadedCount++;
              if (loadedCount === selectedLayerIdxs.length) {
                updateDebugStatus(`Loaded ${loadedCount} layer(s)`);
              }
            })
            .catch(error => {
              updateDebugStatus(`Error loading ${opt.label}`);
              L.popup()
                .setLatLng(initialCenter)
                .setContent(`<div style=\"color:red\">❌ Error loading ${opt.label}:<br>${error.message}</div>`)
                .openOn(map);
            });
        });
      }

      // For other maps, keep single-layer logic
      let geoLayer = null;
      function loadLayer(layerIdx) {
        if (geoLayer) map.removeLayer(geoLayer);
        if (layerIdx === undefined || layerIdx === null || isNaN(layerIdx)) {
          updateDebugStatus('No layer loaded. Please select a layer from the dropdown to proceed.');
          return;
        }
        const opt = LAYER_OPTIONS[layerIdx];
        updateDebugStatus(`Loading ${opt.label}...`);
        // Update loadedLayer for this mapSection
        const thisMapIndex = mapSections.findIndex(ms => ms.map === map);
        if (thisMapIndex >= 0) {
          mapSections[thisMapIndex].loadedLayer = layerIdx;
        }
        fetch(opt.url)
          .then(r => {
            if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`);
            return r.json();
          })
          .then(data => {
            if (!data || !data.features || data.features.length === 0) {
              updateDebugStatus(`Warning: No features in ${opt.label}`);
              L.popup()
                .setLatLng(initialCenter)
                .setContent(`<div style=\"color:orange\">⚠️ No features found in ${opt.label}</div>`)
                .openOn(map);
            } else {
              updateDebugStatus(`Loaded ${opt.label}: ${data.features.length} features`);
            }
            geoLayer = L.geoJSON(data, {
              style: { color: opt.color, weight: 2, fillOpacity: 0.1 },
              onEachFeature: (feature, layer) => {
                const title = opt.label;
                let props = Object.entries(feature.properties).map(([k,v]) => `<b>${k}</b>: ${v}`).join('<br>');
                const content = `<h4 style=\"margin:0 0 5px 0;font-size:14px;color:${opt.color}\">${title}</h4>${props}`;
                layer.bindPopup(content);
                layer.on('click', function(e) {
                  L.DomEvent.stopPropagation(e);
                  const latlng = e.latlng;
                  updateDebugStatus(`Clicked: ${feature.properties.ward_name || feature.properties.id || 'feature'}`);
                  mapSections.forEach((ms) => {
                    if (ms.map !== map) {
                      ms.map.fire('external-feature-click', { latlng });
                    }
                  });
                });
              }
            }).addTo(map);
            // Assign geoLayer to ms.geoLayer in mapSections for search/highlight
            if (thisMapIndex >= 0) {
              mapSections[thisMapIndex].geoLayer = geoLayer;
            }
          })
          .catch(error => {
            updateDebugStatus(`Error loading ${opt.label}`);
            L.popup()
              .setLatLng(initialCenter)
              .setContent(`<div style=\"color:red\">❌ Error loading ${opt.label}:<br>${error.message}</div>`)
              .openOn(map);
          });
      }

      // Do not load any layer by default
      updateDebugStatus('No layer loaded. Please select a layer from the dropdown to proceed.');

      // Add dropdown as a Leaflet control (topright) for maps 1+
      if (idx !== 0) {
        const LayerDropdown = L.Control.extend({
          options: { position: 'topright' },
          onAdd: function() {
            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            const select = L.DomUtil.create('select', '', container);
            select.style.margin = '4px';
            select.style.padding = '2px 6px';
            select.style.fontSize = '1em';
            select.id = `layer-select-${idx}`;
            // Add 'Select...' option at the top
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = 'Select...';
            placeholder.disabled = true;
            placeholder.selected = true;
            select.appendChild(placeholder);
            LAYER_OPTIONS.forEach((opt, i) => {
              const option = document.createElement('option');
              option.value = i;
              option.textContent = opt.label;
              select.appendChild(option);
            });
            L.DomEvent.disableClickPropagation(container);
            L.DomEvent.on(select, 'change', function(e) {
              const layerIdx = parseInt(e.target.value);
              if (isNaN(layerIdx)) return;
              loadLayer(layerIdx);
            });
            return container;
          }
        });
        map.addControl(new LayerDropdown());
      }

      // Store map with additional properties
      if (idx === 0) {
        mapSections.push({ 
          map,  
          geoLayers,  // Array of layers for multi
          index: idx,
          loadedLayers: []  // Track which layers are loaded
        });
      } else {
        mapSections.push({ 
          map,  
          geoLayer,  // Single layer for others
          index: idx,
          loadedLayer: 0  // Track which layer is loaded
        });
      }
    // (removed: now handled in addMapSection for map 0)

    // Expose the multi-layer loader for map 0
    window.loadLayersMultiMap0 = function(selectedLayerIdxs) {
      if (!mapSections[0]) return;
      const ms0 = mapSections[0];
      if (!ms0.map) return;
      // Remove all previous layers
      ms0.geoLayers.forEach(l => ms0.map.removeLayer(l));
      ms0.geoLayers = [];
      if (!selectedLayerIdxs || selectedLayerIdxs.length === 0) {
        const debugEl = document.getElementById('debug-status-0');
        if (debugEl) debugEl.innerHTML = 'Map 0: No layer loaded. Please select one or more layers.';
        return;
      }
      let loadedCount = 0;
      selectedLayerIdxs.forEach(layerIdx => {
        const opt = LAYER_OPTIONS[layerIdx];
        fetch(opt.url)
          .then(r => { if (!r.ok) throw new Error(`HTTP error! status: ${r.status}`); return r.json(); })
          .then(data => {
            const geoLayer = L.geoJSON(data, {
              style: { color: opt.color, weight: 2, fillOpacity: 0.1 },
              onEachFeature: (feature, layer) => {
                const title = opt.label;
                let props = Object.entries(feature.properties).map(([k,v]) => `<b>${k}</b>: ${v}`).join('<br>');
                const content = `<h4 style=\"margin:0 0 5px 0;font-size:14px;color:${opt.color}\">${title}</h4>${props}`;
                layer.bindPopup(content);
                layer.on('click', function(e) {
                  L.DomEvent.stopPropagation(e);
                  const latlng = e.latlng;
                  const debugEl = document.getElementById('debug-status-0');
                  if (debugEl) debugEl.innerHTML = `Map 0: Clicked: ${feature.properties.ward_name || feature.properties.id || 'feature'}`;
                  mapSections.forEach((ms) => {
                    if (ms.map !== ms0.map) {
                      ms.map.fire('external-feature-click', { latlng });
                    }
                  });
                });
              }
            }).addTo(ms0.map);
            ms0.geoLayers.push(geoLayer);
            loadedCount++;
            if (loadedCount === selectedLayerIdxs.length) {
              const debugEl = document.getElementById('debug-status-0');
              if (debugEl) debugEl.innerHTML = `Map 0: Loaded ${loadedCount} layer(s)`;
            }
          })
          .catch(error => {
            const debugEl = document.getElementById('debug-status-0');
            if (debugEl) debugEl.innerHTML = `Map 0: Error loading ${opt.label}`;
            L.popup()
              .setLatLng(initialCenter)
              .setContent(`<div style=\"color:red\">❌ Error loading ${opt.label}:<br>${error.message}</div>`)
              .openOn(ms0.map);
          });
      });
    };
      
      // Sync all maps with each other
      if (mapSections.length > 1) {
        for (let i = 0; i < mapSections.length; i++) {
          for (let j = 0; j < mapSections.length; j++) {
            if (i !== j) {
              mapSections[i].map.sync(mapSections[j].map, { 
                syncCursor: true,
                syncCursorMarkerOptions: {
                  radius: 2,
                  fillOpacity: 0,
                  color: '#ff0000', // Red cursor marker
                  fillColor: '#ff0000'
                }
              });
            }
          }
        }
      }
      
      // Find features at a point for a specific map
      function findFeaturesAtPoint(mapObj, latlng) {
        if (!mapObj.geoLayer) return [];
        
        const results = [];
        const point = turf.point([latlng.lng, latlng.lat]);
        
        mapObj.geoLayer.eachLayer(function(layer) {
          if (!layer.feature) return;
          
          try {
            // Get the feature's geometry type
            const geomType = layer.feature.geometry.type;
            
            // Handle different geometry types
            if (geomType === 'Polygon') {
              if (turf.booleanPointInPolygon(point, layer.feature)) {
                results.push(layer);
              }
            } 
            else if (geomType === 'MultiPolygon') {
              if (turf.booleanPointInPolygon(point, layer.feature)) {
                results.push(layer);
              }
            }
            else if (geomType === 'Point') {
              // For point features, use a small buffer
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const featurePoint = turf.point(layer.feature.geometry.coordinates);
              if (turf.booleanPointInPolygon(featurePoint, buffer)) {
                results.push(layer);
              }
            }
            else if (geomType === 'LineString') {
              // For lines, use a small buffer around the point
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const line = turf.lineString(layer.feature.geometry.coordinates);
              if (turf.booleanIntersects(line, buffer)) {
                results.push(layer);
              }
            }
            else if (geomType === 'MultiLineString') {
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const multiLine = turf.multiLineString(layer.feature.geometry.coordinates);
              if (turf.booleanIntersects(multiLine, buffer)) {
                results.push(layer);
              }
            }
          } catch (e) {
            console.log("Error finding feature at point:", e);
          }
        });
        
        return results;
      }
      
      // Add a status indicator to help debug the map
      const debugControl = L.Control.extend({
        options: { position: 'bottomleft' },
        onAdd: function() {
          const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
          container.style.background = 'white';
          container.style.padding = '3px 6px';
          container.style.fontSize = '12px';
          container.id = `debug-status-${idx}`;
          container.innerHTML = `Map ${idx}: No layer loaded`;
          return container;
        }
      });
      map.addControl(new debugControl());
      
      // Update debug status with layer info
      function updateDebugStatus(status) {
        const debugEl = document.getElementById(`debug-status-${idx}`);
        if (debugEl) debugEl.innerHTML = `Map ${idx}: ${status}`;
      }
      
      // Handle regular map clicks for this map's own layers
      map.on('click', function(e) {
        const clickLatLng = e.latlng;
        
        // Log click for debugging
        console.log(`Click on Map ${idx} at ${clickLatLng.lat.toFixed(5)}, ${clickLatLng.lng.toFixed(5)}`);
        updateDebugStatus(`Clicked at ${clickLatLng.lat.toFixed(5)}, ${clickLatLng.lng.toFixed(5)}`);
        
        // When clicking on the map (not on a feature), we need to:
        // 1. Check if there's a feature at this point
        // 2. If not, just pass the click to other maps
        
        // We'll do a "leaflet-locate-features-at-point" internally
        let featuresFound = false;
        
        if (geoLayer) {
          // Try to find if we clicked on a feature
          geoLayer.eachLayer(function(layer) {
            if (layer.feature && layer._bounds) {
              // For polygons/multipolygons, use turf.js to check if point is inside
              try {
                const point = turf.point([clickLatLng.lng, clickLatLng.lat]);
                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  featuresFound = true;
                }
              } catch(err) {
                console.log("Error checking point in polygon:", err);
              }
            }
          });
        }
        
        // If no features found at click point, just pass the click to other maps
        if (!featuresFound) {
          // Propagate click to other maps
          mapSections.forEach(ms => {
            if (ms.map !== map) {
              ms.map.fire('external-map-click', { 
                latlng: clickLatLng,
                findFeatures: true
              });
            }
          });
        }
      });
      
      // Handle clicks from other maps
      map.on('external-map-click', function(e) {
        const latlng = e.latlng;
        const findFeatures = e.findFeatures;
        
        // Log external click for debugging
        console.log(`External click received on Map ${idx} at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
        updateDebugStatus(`External click received`);
        
        if (findFeatures && geoLayer) {
          // Try to find features at this point in this map
          let foundFeature = false;
          
          geoLayer.eachLayer(function(layer) {
            if (layer.feature) {
              try {
                const point = turf.point([latlng.lng, latlng.lat]);
                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  // We found a feature at this point, open its popup
                  foundFeature = true;
                  layer.openPopup(latlng);
                }
              } catch(err) {
                console.log("Error checking point in polygon:", err);
              }
            }
          });
          
          if (foundFeature) {
            console.log(`Found features at click point in Map ${idx}`);
          } else {
            console.log(`No features found at click point in Map ${idx}`);
          }
        }
      });
      
      // Handle external feature clicks (from features in other maps)
      map.on('external-feature-click', function(e) {
        const latlng = e.latlng;
        
        console.log(`External feature click received on Map ${idx} at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
        updateDebugStatus(`External feature click received`);
        
        if (geoLayer) {
          // Try to find features at this point in this map
          geoLayer.eachLayer(function(layer) {
            if (layer.feature) {
              try {
                const point = turf.point([latlng.lng, latlng.lat]);
                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  // If we find a feature at this point, open its popup
                  layer.openPopup(latlng);
                }
              } catch(err) {
                console.log("Error checking point in polygon:", err);
              }
            }
          });
        }
      });
      
      // Cursor sync (crosshair)
      map.on('mousemove', function(e) {
        mapSections.forEach((ms, i) => {
          if (ms.map !== map) {
            ms.map.fire('external-cursor-move', { latlng: e.latlng });
          }
        });
      });
      // Draw crosshair on cursor sync
      let crosshair = null;
      map.on('external-cursor-move', function(e) {
        if (crosshair) map.removeLayer(crosshair);
        crosshair = L.circleMarker(e.latlng, {
          radius: 8,
          color: '#ff0000',
          weight: 2,
          fillOpacity: 0.2
        }).addTo(map);
        setTimeout(() => { if (crosshair) map.removeLayer(crosshair); }, 500);
      });
    }

    // Helper to clear all map sections
    function clearAllMapSections() {
      while (mapSections.length > 0) {
        const idx = mapSections.length - 1;
        const section = document.getElementById(`map-section-${idx}`);
        if (section) section.remove();
        const ms = mapSections.pop();
        if (ms && ms.map) ms.map.remove();
      }
    }

    // Helper to force all maps to resize and recenter
    function forceAllMapsResize() {
      setTimeout(() => {
        mapSections.forEach(ms => {
          ms.map.invalidateSize();
          ms.map.setView(ms.map.getCenter(), ms.map.getZoom(), { animate: false });
        });
      }, 100);
    }

    // Set to 1x2 grid (2 maps)
    function set1x2Grid() {
      clearAllMapSections();
      addMapSection();
      addMapSection();
      forceAllMapsResize();
    }

    // Set to 2x2 grid (4 maps)
    function set2x2Grid() {
      clearAllMapSections();
      addMapSection();
      addMapSection();
      addMapSection();
      addMapSection();
      forceAllMapsResize();
    }

    // Initial grid: 1x2
    set1x2Grid();

    // Grid layout buttons
    document.getElementById('btn-1x2').onclick = set1x2Grid;
    document.getElementById('btn-2x2').onclick = set2x2Grid;
  </script>
</body>
</html>
