<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Bengaluru Wards Comparison Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #map-container {
      display: grid;
      width: 100vw;
      height: calc(100vh - 70px);
      min-height: 0;
      overflow: hidden;
      grid-gap: 2px;
      background: #111;
      /* Default: 2 maps side by side */
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .map-section {
      min-width: 0;
      min-height: 0;
      position: relative;
      border: 1px solid #111;
      border-radius: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      background: #f8f8f8;
      overflow: hidden;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }
    .map {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      border-radius: 0;
      overflow: hidden;
    }
    .split-btn {
      background: #1976d2;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 0.95em;
    }
    /* Comparison Panel Styles */
    #comparison-panel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.32);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #comparison-panel.active {
      display: flex;
    }
    #comparison-panel-content {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      padding: 0;
      min-width: 800px;
      max-width: 95vw;
      max-height: 90vh;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: row;
    }
    #comparison-left-panel {
      flex: 1;
      min-width: 300px;
      padding: 32px 24px 24px 28px;
      overflow-y: auto;
      border-right: 1px solid #e0e0e0;
    }
    #comparison-right-panel {
      flex: 2;
      min-width: 600px;
      display: flex;
      flex-direction: column;
      background: #f9f9f9;
    }
    #comparison-map-legend {
      position: absolute;
      bottom: 10px;
      right: 10px;
      background: rgba(255,255,255,0.95);
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 0.85em;
      z-index: 1000;
    }
    #comparison-panel h3 {
      margin: 0 0 16px 0;
      color: #ff9800;
      font-size: 1.2em;
    }
    .comparison-result {
      margin: 12px 0;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 4px;
      border-left: 4px solid #2196F3;
    }
    .comparison-result.exact-match {
      border-left-color: #4CAF50;
    }
    .comparison-result.partial-match {
      border-left-color: #FF9800;
    }
    .comparison-result.no-match {
      border-left-color: #F44336;
    }
    @media (max-width: 900px) {
      #map-container {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr 1fr 1fr;
        height: calc(100vh - 70px);
      }
      .map-section {
        min-width: 0;
        min-height: 0;
      }
    }

  </style>
</head>
<body>
  <div style="display: flex; align-items: center; justify-content: center; margin-top: 16px; margin-bottom: 8px; gap: 12px; width: 100%; max-width: 1200px; margin-left: auto; margin-right: auto;">
    <h2 style="margin: 0 12px 0 0; flex-shrink: 0;">GBA Area Compare</h2>
    <div id="search-bar-container" style="margin-left: auto; position: relative; min-width: 260px; max-width: 420px; width: 100%; display: flex; align-items: center; gap: 6px;">
      <input id="location-search" type="text" placeholder="Search ward, village, or settlement..." style="flex:1; padding: 7px 10px; font-size: 1em; border: 1.5px solid #bbb; border-radius: 4px; outline: none;" autocomplete="off">
      <div id="autocomplete-list" style="position: absolute; left: 0; top: 100%; z-index: 1000; background: #fff; border: 1px solid #ccc; border-radius: 0 0 4px 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); width: 100%; display: none;"></div>
    </div>

    <div id="toggle-btn-group" style="display: flex; margin-left: 16px; background: #e3eaf3; border-radius: 6px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.04);">
      <button id="btn-1x2" class="toggle-btn toggle-btn-active" title="1x2 Grid" style="border: none; background: none; padding: 0 14px; height: 36px; display: flex; align-items: center; gap: 6px; font-size: 1em; color: #1976d2; background: #fff; border-right: 1.5px solid #c7d0e0; cursor: pointer; transition: background 0.15s, color 0.15s; outline: none;">
        <svg width="28" height="20" viewBox="0 0 28 20"><rect x="2" y="2" width="10" height="16" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/><rect x="16" y="2" width="10" height="16" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/></svg>
      </button>
      <button id="btn-2x2" class="toggle-btn" title="2x2 Grid" style="border: none; background: none; padding: 0 14px; height: 36px; display: flex; align-items: center; gap: 6px; font-size: 1em; color: #222; background: transparent; cursor: pointer; transition: background 0.15s, color 0.15s; outline: none;">
        <svg width="28" height="20" viewBox="0 0 28 20"><rect x="2" y="2" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/><rect x="16" y="2" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/><rect x="2" y="11" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/><rect x="16" y="11" width="10" height="7" rx="2" fill="#f8f8f8" stroke="#1976d2" stroke-width="2"/></svg>
      </button>
    </div>
    <button id="compare-polygons-btn" class="split-btn" style="margin-left: auto; font-weight: 600; background: #ff9800; color: #fff;">🔍 Area Compare</button>
  </div>
  <div id="map-container"></div>
  
  <!-- Comparison Panel -->
  <div id="comparison-panel">
    <div id="comparison-panel-content">
      <button id="close-comparison-panel" style="position:absolute; top:10px; right:14px; background:none; border:none; font-size:1.5em; color:#888; cursor:pointer; z-index:10;">&times;</button>
      
      <!-- Left Panel: Controls and Results -->
      <div id="comparison-left-panel">
        <h3 style="margin:0 0 20px 0; color:#ff9800; font-size:1.2em;">🔍 Area Compare</h3>
        <div id="comparison-content">
          <div style="margin-bottom:16px;">
            <label style="font-weight:600; display:block; margin-bottom:6px;">Base Layer</label>
            <select id="comparison-base-layer" style="width:100%; padding:8px; font-size:1em; border:1px solid #ccc; border-radius:4px;">
              <option value="" disabled selected>Select layer...</option>
            </select>
          </div>
          <div style="margin-bottom:16px;">
            <label style="font-weight:600; display:block; margin-bottom:6px;">Select Feature</label>
            <input id="comparison-search" type="text" placeholder="Search feature..." style="width:100%; padding:8px; font-size:1em; border:1px solid #ccc; border-radius:4px;" autocomplete="off">
            <div id="comparison-autocomplete" style="position:relative;"></div>
          </div>
          <div style="margin-bottom:16px;">
            <label style="font-weight:600; display:block; margin-bottom:6px;">Compare Layer</label>
            <select id="comparison-compare-layer" style="width:100%; padding:8px; font-size:1em; border:1px solid #ccc; border-radius:4px;">
              <option value="" disabled selected>Select layer to compare...</option>
            </select>
          </div>
          <div style="display:flex; gap:10px; margin-bottom:16px;">
            <button id="run-comparison-btn" style="flex:1; padding:10px; background:#1976d2; color:#fff; border:none; border-radius:4px; font-size:1.05em; font-weight:600; cursor:pointer;">Compare</button>
            <button id="reset-comparison-btn" style="flex:1; padding:10px; background:#bbb; color:#222; border:none; border-radius:4px; font-size:1.05em; font-weight:600; cursor:pointer;">Reset</button>
          </div>
          <div id="comparison-results" style="margin-top:16px;"></div>
        </div>
      </div>
      
      <!-- Right Panel: Map Viewport -->
      <div id="comparison-right-panel">
        <div id="comparison-map-container" style="width:100%; height:100%; display:none; position:relative;">
          <div id="comparison-map" style="width:100%; height:100%;"></div>
        </div>
      </div>
      
    </div>
  </div>
  
  <!-- SVG Patterns for hatching -->
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="8" height="8">
        <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" style="stroke:#F44336; stroke-width:1" />
      </pattern>
      <pattern id="blueHatch" patternUnits="userSpaceOnUse" width="8" height="8">
        <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" style="stroke:#2196F3; stroke-width:1" />
      </pattern>
      <pattern id="greenHatch" patternUnits="userSpaceOnUse" width="8" height="8">
        <path d="M-1,1 l2,-2 M0,8 l8,-8 M7,9 l2,-2" style="stroke:#4CAF50; stroke-width:1" />
      </pattern>
    </defs>
  </svg>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://jieter.github.io/Leaflet.Sync/L.Map.Sync.js"></script>
  <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
  <script>
    // ============================================================================
    // CONFIGURATION
    // ============================================================================
    const LAYER_OPTIONS = [
      { label: 'New GBA Wards', url: 'geojson/gba_wards.geojson', color: 'green', searchField: 'ward_name' },
      { label: 'BBMP Wards', url: 'geojson/bbmp_wards.geojson', color: 'blue', searchField: 'Ward Name (en)' },
      { label: 'GBA Final Wards', url: 'geojson/GBA_Final_Wards_369.geojson', color: 'teal', searchField: 'ward_name' },
      { label: 'Villages', url: 'geojson/villages.geojson', color: 'orange', searchField: 'Village Name' },
      { label: 'Settlements', url: 'geojson/bbmp_settlements.geojson', color: 'purple', searchField: 'KGISVill_2' },
      { label: 'GBA Zones', url: 'geojson/zones.geojson', color: 'red', searchField: null }
    ];

    const SEARCHABLE_LAYERS = LAYER_OPTIONS.filter(l => l.searchField);
    const initialCenter = [12.9716, 77.5946];
    const initialZoom = 11;
    const maxSections = 4;

    // ============================================================================
    // UTILITY FUNCTIONS
    // ============================================================================
    
    // Get filtered popup properties based on layer type
    function getPopupProps(label, props) {
      switch (label) {
        case 'GBA Final Wards':
        case 'New GBA Wards':
          return `<b>Corporation</b>: ${props.Corporation || ''}<br><b>Ward Name</b>: ${props.ward_name || ''}`;
        case 'BBMP Wards':
          return `<b>Ward Name (en)</b>: ${props['Ward Name (en)'] || ''}`;
        case 'Villages':
          return `<b>fid</b>: ${props.fid || ''}<br><b>Village Name</b>: ${props['Village Name'] || ''}`;
        case 'Settlements':
          return `<b>KGISVillageID</b>: ${props.KGISVillageID || ''}<br><b>Category</b>: ${props.Category || ''}<br><b>Kharab</b>: ${props.Kharab || ''}<br><b>Surveynumber_Old</b>: ${props.Surveynumber_Old || ''}<br><b>KGISVill_2</b>: ${props.KGISVill_2 || ''}`;
        case 'GBA Zones':
          return `<b>Corporation/Zone</b>: ${props['Corporation/Zone'] || ''}`;
        default:
          return Object.entries(props).map(([k,v]) => `<b>${k}</b>: ${v}`).join('<br>');
      }
    }

    // Create popup HTML with lat/lng copy button
    function createPopupContent(layerLabel, layerColor, props, lat, lng) {
      const propsHtml = getPopupProps(layerLabel, props);
      const copyHtml = (lat && lng) ? 
        `<div style='margin-top:6px;font-size:0.97em;'>Lat: <b>${lat.toFixed ? lat.toFixed(6) : lat}</b><br>Lng: <b>${lng.toFixed ? lng.toFixed(6) : lng}</b><br><button id='copy-latlng-btn' style='margin-top:4px;padding:2px 10px;font-size:0.98em;cursor:pointer;'>Copy</button></div>` 
        : '';
      return `<h4 style="margin:0 0 5px 0;font-size:14px;color:${layerColor}">${layerLabel}</h4>${propsHtml}${copyHtml}`;
    }

    // Attach copy button handler to popup
    function attachCopyButtonHandler(lat, lng) {
      setTimeout(() => {
        const btn = document.getElementById('copy-latlng-btn');
        if (btn && lat && lng) {
          btn.onclick = function() {
            navigator.clipboard.writeText(`${lat}, ${lng}`);
            btn.textContent = 'Copied!';
            setTimeout(() => { btn.textContent = 'Copy'; }, 1200);
          };
        }
      }, 100);
    }

    // ============================================================================
    // SEARCH & AUTOCOMPLETE
    // ============================================================================
    let searchIndex = [];

    async function buildSearchIndex() {
      searchIndex = [];
      for (const layer of SEARCHABLE_LAYERS) {
        try {
          const resp = await fetch(layer.url);
          if (!resp.ok) continue;
          const data = await resp.json();
          if (!data.features) continue;
          for (const feat of data.features) {
            const val = feat.properties[layer.searchField];
            if (val && typeof val === 'string' && val.trim().length > 0) {
              searchIndex.push({
                label: val.trim(),
                layerLabel: layer.label,
                layerIdx: LAYER_OPTIONS.indexOf(layer),
                feature: feat
              });
            }
          }
        } catch (e) { console.warn('Error loading for search index:', layer.label, e); }
      }
      // Sort alphabetically
      searchIndex.sort((a, b) => a.label.localeCompare(b.label));
    }

    // --- Autocomplete UI logic ---
    const searchInput = document.getElementById('location-search');
    const autocompleteList = document.getElementById('autocomplete-list');
    let currentFocus = -1;

    function closeAutocomplete() {
      autocompleteList.style.display = 'none';
      autocompleteList.innerHTML = '';
      currentFocus = -1;
    }

    function highlightFeatureOnMaps(selected) {
      mapSections.forEach((ms) => {
        // Map 0: multi-layer
        if (ms.index === 0 && Array.isArray(ms.geoLayers) && ms.geoLayers.length > 0) {
          if (ms.loadedLayers && ms.loadedLayers.includes(selected.layerIdx)) {
            highlightFeatureInMultiLayers(ms, selected);
          }
        } else if (ms.index !== 0 && ms.geoLayer) {
          // For other maps, check if the loadedLayer matches the selected layerIdx
          if (typeof ms.loadedLayer === 'number' && ms.loadedLayer === selected.layerIdx) {
            highlightFeatureInLayer(ms, selected);
          }
        }
      });
    }

    function highlightFeatureInMultiLayers(ms, selected) {
      // Find the geoLayer in ms.geoLayers that matches selected.layerIdx
      const field = LAYER_OPTIONS[selected.layerIdx].searchField;
      const selectedVal = (selected.feature.properties[field] || '').toString().trim().toLowerCase();
      ms.geoLayers.forEach((geoLayer, i) => {
        // Only check the correct layer
        // We don't have a direct reference to which geoLayer is for which layerIdx, so check a feature property
        let found = false;
        geoLayer.eachLayer(layer => {
          if (!layer.feature) return;
          if (layer.feature.properties && selected.feature.properties) {
            const layerVal = (layer.feature.properties[field] || '').toString().trim().toLowerCase();
            if (field && layerVal === selectedVal) {
              // Zoom to feature
              if (!found) {
                if (layer.getBounds) {
                  ms.map.fitBounds(layer.getBounds(), { maxZoom: 16 });
                } else if (layer.getLatLng) {
                  ms.map.setView(layer.getLatLng(), 16);
                }
                found = true;
              }
              // Flash/highlight: set style, open popup
              if (layer.setStyle) {
                layer.setStyle({ color: '#ff6600', weight: 4, fillOpacity: 0.3 });
                setTimeout(() => {
                  layer.setStyle({ color: LAYER_OPTIONS[selected.layerIdx].color, weight: 2, fillOpacity: 0.1 });
                }, 1800);
              }
              if (layer.openPopup) {
                layer.openPopup();
              }
            }
          }
        });
      });
    }

    function highlightFeatureInLayer(ms, selected) {
      if (!ms.geoLayer) return;
      const field = LAYER_OPTIONS[selected.layerIdx].searchField;
      const selectedVal = (selected.feature.properties[field] || '').toString().trim().toLowerCase();
      ms.geoLayer.eachLayer(layer => {
        if (!layer.feature) return;
        if (layer.feature.properties && selected.feature.properties) {
          const layerVal = (layer.feature.properties[field] || '').toString().trim().toLowerCase();
          if (field && layerVal === selectedVal) {
            // Zoom to feature
            if (layer.getBounds) {
              ms.map.fitBounds(layer.getBounds(), { maxZoom: 16 });
            } else if (layer.getLatLng) {
              ms.map.setView(layer.getLatLng(), 16);
            }
            // Flash/highlight: set style, open popup
            if (layer.setStyle) {
              layer.setStyle({ color: '#ff6600', weight: 4, fillOpacity: 0.3 });
              setTimeout(() => {
                layer.setStyle({ color: LAYER_OPTIONS[selected.layerIdx].color, weight: 2, fillOpacity: 0.1 });
              }, 1800);
            }
            if (layer.openPopup) {
              layer.openPopup();
            }
          }
        }
      });
    }


    async function showAutocomplete(val) {
      closeAutocomplete();
      if (!val || val.length < 2) return;
      const matches = searchIndex.filter(item => item.label.toLowerCase().includes(val.toLowerCase()));
      let results = [];
      // Add geojson feature results
      matches.slice(0, 10).forEach(item => {
        results.push({
          type: 'geojson',
          label: item.label,
          layerLabel: item.layerLabel,
          item
        });
      });

      // Lat/lng search: detect "lat, lng" pattern
      const latlngRegex = /^\s*(-?\d{1,2}\.\d+)[,\s]+(-?\d{1,3}\.\d+)\s*$/;
      const latlngMatch = val.match(latlngRegex);
      if (latlngMatch) {
        const lat = parseFloat(latlngMatch[1]);
        const lng = parseFloat(latlngMatch[2]);
        if (!isNaN(lat) && !isNaN(lng)) {
          results.push({
            type: 'latlng',
            label: `Lat/Lng: ${lat}, ${lng}`,
            lat, lng
          });
        }
      }

      // Base map search (Nominatim)
      let nominatimResults = [];
      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=5&addressdetails=1`);
        if (resp.ok) {
          const data = await resp.json();
          if (Array.isArray(data)) {
            nominatimResults = data.map(place => ({
              type: 'nominatim',
              label: place.display_name,
              lat: parseFloat(place.lat),
              lng: parseFloat(place.lon)
            }));
          }
        }
      } catch (e) { /* ignore errors */ }
      nominatimResults.forEach(r => results.push(r));

      if (results.length === 0) return;
      autocompleteList.style.display = 'block';
      autocompleteList.innerHTML = '';
      results.forEach((result, idx) => {
        const div = document.createElement('div');
        div.style.padding = '7px 12px';
        div.style.cursor = 'pointer';
        div.style.borderBottom = '1px solid #eee';
        if (result.type === 'geojson') {
          div.innerHTML = `<span style="font-weight:600">${result.label}</span> <span style="color:#888;font-size:0.95em;">(Geo Layer: ${result.layerLabel})</span>`;
        } else if (result.type === 'latlng') {
          div.innerHTML = `<span style="font-weight:600">${result.label}</span> <span style="color:#1976d2;font-size:0.95em;">(Lat/Lng Search)</span>`;
        } else if (result.type === 'nominatim') {
          div.innerHTML = `<span style="font-weight:600">${result.label}</span> <span style="color:#43a047;font-size:0.95em;">(Base Map)</span>`;
        }
        div.onmousedown = (e) => {
          e.preventDefault();
          searchInput.value = result.label;
          closeAutocomplete();
          if (result.type === 'geojson') {
            highlightFeatureOnMaps(result.item);
          } else if (result.type === 'latlng' || result.type === 'nominatim') {
            // Remove previous search markers if any
            if (window._searchMarkers) {
              window._searchMarkers.forEach(m => m.remove && m.remove());
            }
            window._searchMarkers = [];
            // Zoom and add marker to all maps
            mapSections.forEach(ms => {
              ms.map.setView([result.lat, result.lng], 16);
              const marker = L.marker([result.lat, result.lng], {
                icon: L.icon({
                  iconUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png',
                  iconSize: [25, 41],
                  iconAnchor: [12, 41],
                  popupAnchor: [1, -34],
                  shadowUrl: 'https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png',
                  shadowSize: [41, 41]
                })
              }).addTo(ms.map);
              window._searchMarkers.push(marker);
            });
          }
        };
        autocompleteList.appendChild(div);
      });
    }

    searchInput.addEventListener('input', function(e) {
      showAutocomplete(this.value);
    });

    searchInput.addEventListener('keydown', function(e) {
      let items = autocompleteList.getElementsByTagName('div');
      if (e.key === 'ArrowDown') {
        currentFocus++;
        if (currentFocus >= items.length) currentFocus = 0;
        setActive(items);
      } else if (e.key === 'ArrowUp') {
        currentFocus--;
        if (currentFocus < 0) currentFocus = items.length - 1;
        setActive(items);
      } else if (e.key === 'Enter') {
        e.preventDefault();
        if (currentFocus > -1 && items[currentFocus]) {
          items[currentFocus].dispatchEvent(new MouseEvent('mousedown'));
        }
      }
    });

    function setActive(items) {
      for (let i = 0; i < items.length; i++) {
        items[i].style.background = '#fff';
      }
      if (currentFocus > -1 && items[currentFocus]) {
        items[currentFocus].style.background = '#e3f0ff';
        items[currentFocus].scrollIntoView({ block: 'nearest' });
      }
    }

    document.addEventListener('click', function(e) {
      if (e.target !== searchInput) closeAutocomplete();
    });

    // Call on page load
    buildSearchIndex();

    // ============================================================================
    // MAP MANAGEMENT
    // ============================================================================
    let mapSections = [];

    function createMapSection(idx) {
      const section = document.createElement('div');
      section.className = 'map-section';
      section.id = `map-section-${idx}`;

      // Map div
      const mapDiv = document.createElement('div');
      mapDiv.className = 'map';
      mapDiv.id = `map${idx}`;
      section.appendChild(mapDiv);

      return section;
    }

    // Dynamically update grid layout based on actual DOM map-section count
    function updateGridLayout() {
      const container = document.getElementById('map-container');
      // Use DOM children count so layout matches what's rendered
      const count = container.querySelectorAll('.map-section').length;

      // Reset defaults
      container.style.gridGap = '2px';
      container.style.background = '#f0f0f0';

      }
      let geoLayers = [];
      // For map 0, support multiple layers
      function loadLayersMulti(selectedLayerIdxs) {

      // Do not load any layer by default

      // Add dropdown as a Leaflet control (topright) for maps 1+
      if (idx !== 0) {

      // Store map with additional properties
      if (idx === 0) {
        mapSections.push({

      } else {

      // Update layout now that mapSections/DOM have changed
      updateGridLayout();
    // (removed: now handled in addMapSection for map 0)

    // Expose the multi-layer loader for map 0
    window.loadLayersMultiMap0 = function(selectedLayerIdxs) {

      if (!selectedLayerIdxs || selectedLayerIdxs.length === 0) {

      let loadedCount = 0;

          .then(data => {

    };
      
      // Sync all maps with each other
      if (mapSections.length > 1) {
        for (let i = 0; i < mapSections.length; i++) {

      // Find features at a point for a specific map
      function findFeaturesAtPoint(mapObj, latlng) {
        if (!mapObj.geoLayer) return [];
        
        const results = [];
        const point = turf.point([latlng.lng, latlng.lat]);
        
        mapObj.geoLayer.eachLayer(function(layer) {
          if (!layer.feature) return;
          
          try {
            // Get the feature's geometry type
            const geomType = layer.feature.geometry.type;
            
            // Handle different geometry types
            if (geomType === 'Polygon') {
              if (turf.booleanPointInPolygon(point, layer.feature)) {
                results.push(layer);
              }
            } 
            else if (geomType === 'MultiPolygon') {
              if (turf.booleanPointInPolygon(point, layer.feature)) {
                results.push(layer);
              }
            }
            else if (geomType === 'Point') {
              // For point features, use a small buffer
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const featurePoint = turf.point(layer.feature.geometry.coordinates);
              if (turf.booleanPointInPolygon(featurePoint, buffer)) {
                results.push(layer);
              }
            }
            else if (geomType === 'LineString') {
              // For lines, use a small buffer around the point
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const line = turf.lineString(layer.feature.geometry.coordinates);
              if (turf.booleanIntersects(line, buffer)) {
                results.push(layer);
              }
            }
            else if (geomType === 'MultiLineString') {
              const buffer = turf.buffer(point, 0.02, {units: 'kilometers'});
              const multiLine = turf.multiLineString(layer.feature.geometry.coordinates);
              if (turf.booleanIntersects(multiLine, buffer)) {
                results.push(layer);
              }
            }
          } catch (e) {
            console.log("Error finding feature at point:", e);
          }
        });
        
        return results;
      }
      
      // Add a status indicator to help debug the map
      const debugControl = L.Control.extend({
        options: { position: 'bottomleft' },

          container.innerHTML = `Map ${idx}: No layer loaded`;
          return container;
        }
      });
      map.addControl(new debugControl());
      
      // Update debug status with layer info
      function updateDebugStatus(status) {
        const debugEl = document.getElementById(`debug-status-${idx}`);
        if (debugEl) debugEl.innerHTML = `Map ${idx}: ${status}`;
      }
      
      // Handle regular map clicks for this map's own layers
      map.on('click', function(e) {
        const clickLatLng = e.latlng;
        
        // Log click for debugging
        console.log(`Click on Map ${idx} at ${clickLatLng.lat.toFixed(5)}, ${clickLatLng.lng.toFixed(5)}`);
        updateDebugStatus(`Clicked at ${clickLatLng.lat.toFixed(5)}, ${clickLatLng.lng.toFixed(5)}`);
        
        // When clicking on the map (not on a feature), we need to:
        // 1. Check if there's a feature at this point
        // 2. If not, just pass the click to other maps
        
        // We'll do a "leaflet-locate-features-at-point" internally
        let featuresFound = false;
        
        if (geoLayer) {
          // Try to find if we clicked on a feature
          geoLayer.eachLayer(function(layer) {
            if (layer.feature && layer._bounds) {
              // For polygons/multipolygons, use turf.js to check if point is inside
              try {
                const point = turf.point([clickLatLng.lng, clickLatLng.lat]);
                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  featuresFound = true;
                }
              } catch(err) {
                console.log("Error checking point in polygon:", err);
              }
            }
          });
        }
        
        // If no features found at click point, just pass the click to other maps
        if (!featuresFound) {
          // Propagate click to other maps
          mapSections.forEach(ms => {
            if (ms.map !== map) {
              ms.map.fire('external-map-click', { 
                latlng: clickLatLng,
                findFeatures: true
              });
            }
          });
        }
      });
      
      // Handle clicks from other maps
      map.on('external-map-click', function(e) {
        const latlng = e.latlng;
        const findFeatures = e.findFeatures;
        
        // Log external click for debugging
        console.log(`External click received on Map ${idx} at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
        updateDebugStatus(`External click received`);
        
        if (findFeatures && geoLayer) {
          // Try to find features at this point in this map
          let foundFeature = false;
          
          geoLayer.eachLayer(function(layer) {
            if (layer.feature) {
              try {
                const point = turf.point([latlng.lng, latlng.lat]);
                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  // We found a feature at this point, open its popup
                  foundFeature = true;
                  layer.openPopup(latlng);
                }
              } catch(err) {
                console.log("Error checking point in polygon:", err);
              }
            }
          });
          
          if (foundFeature) {
            console.log(`Found features at click point in Map ${idx}`);
          } else {
            console.log(`No features found at click point in Map ${idx}`);
          }
        }
      });
      
      // Handle external feature clicks (from features in other maps)
      map.on('external-feature-click', function(e) {
        const latlng = e.latlng;
        
        console.log(`External feature click received on Map ${idx} at ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`);
        updateDebugStatus(`External feature click received`);
        
        if (geoLayer) {
          // Try to find features at this point in this map
          geoLayer.eachLayer(function(layer) {
            if (layer.feature) {
              try {

                if (turf.booleanPointInPolygon(point, layer.feature)) {
                  // If we find a feature at this point, open its popup

              }
            }
          });

      // Cursor sync (crosshair)

        }).addTo(map);
        setTimeout(() => { if (crosshair) map.removeLayer(crosshair); }, 500);
      });
    }

    // Helper to clear all map sections
    function clearAllMapSections() {
      while (mapSections.length > 0) {
        const idx = mapSections.length - 1;
        const section = document.getElementById(`map-section-${idx}`);
        if (section) section.remove();
        const ms = mapSections.pop();
        if (ms && ms.map) {
          // Remove all controls before removing the map to avoid Leaflet errors
          if (ms.map._controls && Array.isArray(ms.map._controls)) {
            ms.map._controls.forEach(ctrl => {
              try { ms.map.removeControl(ctrl); } catch (e) {}
            });
          }
          ms.map.remove();
        }
      }
      // Ensure layout updates after we've removed DOM nodes
      setTimeout(() => updateGridLayout(), 20);
    }

    // Helper to force all maps to resize and recenter
    function forceAllMapsResize() {
      setTimeout(() => {
        mapSections.forEach(ms => {
          ms.map.invalidateSize();
          ms.map.setView(ms.map.getCenter(), ms.map.getZoom(), { animate: false });
        });
      }, 100);
    }

    // Set to 1x2 grid (2 maps)
    function set1x2Grid() {
      clearAllMapSections();
      addMapSection();
      addMapSection();
      forceAllMapsResize();
    }

    // Set to 2x2 grid (4 maps)
    function set2x2Grid() {
      clearAllMapSections();
      addMapSection();
      addMapSection();
      addMapSection();
      addMapSection();
      forceAllMapsResize();
    }

    // Initial grid: 1x2
    set1x2Grid();

    // Grid layout buttons
    // Toggle button group logic
    const btn1x2 = document.getElementById('btn-1x2');
    const btn2x2 = document.getElementById('btn-2x2');
    function setActiveToggleBtn(btn) {
      btn1x2.classList.remove('toggle-btn-active');
      btn2x2.classList.remove('toggle-btn-active');
      btn.classList.add('toggle-btn-active');
    }
    btn1x2.onclick = function() {
      setActiveToggleBtn(btn1x2);
      set1x2Grid();
    };
    btn2x2.onclick = function() {
      setActiveToggleBtn(btn2x2);
      set2x2Grid();
    };

    // ============================================================================
    // AREA COMPARISON FEATURE
    // ============================================================================
    
    // State management
    let comparisonLayers = {};
    let comparisonOverlays = [];
    let selectedBaseFeature = null;

    // Data loading
    async function loadComparisonData() {
      for (const layer of LAYER_OPTIONS) {
        if (!comparisonLayers[layer.label]) {
          try {
            const resp = await fetch(layer.url);
            if (resp.ok) {
              const data = await resp.json();
              comparisonLayers[layer.label] = data;
            }
          } catch (e) {
            console.warn('Error loading comparison data:', layer.label, e);
          }
        }
      }
    }

    // UI Setup
    const comparisonPanel = document.getElementById('comparison-panel');
    const comparePolygonsBtn = document.getElementById('compare-polygons-btn');
    const closeComparisonPanel = document.getElementById('close-comparison-panel');
    const comparisonBaseLayer = document.getElementById('comparison-base-layer');
    const comparisonCompareLayer = document.getElementById('comparison-compare-layer');
    const comparisonSearch = document.getElementById('comparison-search');
    const comparisonAutocomplete = document.getElementById('comparison-autocomplete');
    const runComparisonBtn = document.getElementById('run-comparison-btn');
    const resetComparisonBtn = document.getElementById('reset-comparison-btn');
    const comparisonResults = document.getElementById('comparison-results');
    const comparisonMapContainer = document.getElementById('comparison-map-container');
    let comparisonMap = null;

    // Populate base layer dropdown
    SEARCHABLE_LAYERS.forEach((layer, i) => {
      const opt = document.createElement('option');
      opt.value = LAYER_OPTIONS.indexOf(layer);
      opt.textContent = layer.label;
      comparisonBaseLayer.appendChild(opt);
    });
    
    // Populate compare layer dropdown
    SEARCHABLE_LAYERS.forEach((layer, i) => {
      const opt = document.createElement('option');
      opt.value = LAYER_OPTIONS.indexOf(layer);
      opt.textContent = layer.label;
      comparisonCompareLayer.appendChild(opt);
    });

    comparePolygonsBtn.addEventListener('click', () => {
      comparisonPanel.classList.add('active');
      loadComparisonData();
      // Initialize comparison map if not already done
      setTimeout(() => {
        if (!comparisonMap) {
          comparisonMap = L.map('comparison-map', {
            center: initialCenter,
            zoom: 11,
            zoomControl: true,
            scrollWheelZoom: true
          });
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19,
            opacity: 0.85
          }).addTo(comparisonMap);
        }
      }, 100);
    });

    closeComparisonPanel.addEventListener('click', () => {
      comparisonPanel.classList.remove('active');
      clearComparisonOverlays();
    });

    // Close modal on background click
    comparisonPanel.addEventListener('click', (e) => {
      if (e.target === comparisonPanel) {
        comparisonPanel.classList.remove('active');
        clearComparisonOverlays();
      }
    });

    // Event Handlers - Autocomplete
    comparisonSearch.addEventListener('input', function() {
      const layerIdx = parseInt(comparisonBaseLayer.value);
      const val = this.value.trim().toLowerCase();
      comparisonAutocomplete.innerHTML = '';
      comparisonAutocomplete.style.display = 'none';
      if (!val || isNaN(layerIdx)) return;
      const opt = LAYER_OPTIONS[layerIdx];
      const matches = searchIndex.filter(item => item.layerLabel === opt.label && item.label.toLowerCase().includes(val));
      const results = matches.slice(0, 10);
      if (results.length === 0) return;
      comparisonAutocomplete.style.display = 'block';
      comparisonAutocomplete.innerHTML = '<div style="position:absolute; left:0; top:2px; z-index:1001; background:#fff; border:1px solid #ccc; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,0.08); width:100%; max-height:200px; overflow-y:auto;">' +
        results.map((item, i) => `<div class="comparison-ac-item" data-idx="${i}" style="padding:7px 12px; cursor:pointer; border-bottom:1px solid #eee;">${item.label}</div>`).join('') + '</div>';
      Array.from(comparisonAutocomplete.querySelectorAll('.comparison-ac-item')).forEach((el, i) => {
        el.addEventListener('mousedown', function(e) {
          comparisonSearch.value = results[i].label;
          selectedBaseFeature = results[i].feature;
          comparisonAutocomplete.style.display = 'none';
        });
        el.addEventListener('mouseover', function() {
          this.style.background = '#e3f0ff';
        });
        el.addEventListener('mouseout', function() {
          this.style.background = '#fff';
        });
      });
    });

    // Event Handlers - Run Comparison
    runComparisonBtn.addEventListener('click', async () => {
      if (!selectedBaseFeature) {
        alert('Please select a feature to compare');
        return;
      }
      const baseLayerIdx = parseInt(comparisonBaseLayer.value);
      if (isNaN(baseLayerIdx)) {
        alert('Please select a base layer');
        return;
      }
      const compareLayerIdx = parseInt(comparisonCompareLayer.value);
      if (isNaN(compareLayerIdx)) {
        alert('Please select a compare layer');
        return;
      }
      await performComparison(selectedBaseFeature, baseLayerIdx, compareLayerIdx);
    });

    // Add Reset button logic
    if (resetComparisonBtn) {
      resetComparisonBtn.onclick = function() {
        comparisonResults.innerHTML = '';
        clearComparisonOverlays();
        comparisonSearch.value = '';
        selectedBaseFeature = null;
        comparisonBaseLayer.selectedIndex = 0;
        comparisonCompareLayer.selectedIndex = 0;
      };
    }

    // Core Comparison Logic
    function clearComparisonOverlays() {
      comparisonOverlays.forEach(overlay => {
        if (comparisonMap && overlay) {
          try { comparisonMap.removeLayer(overlay); } catch(e) {}
        }
      });
      comparisonOverlays = [];
      if (comparisonMapContainer) {
        comparisonMapContainer.style.display = 'none';
      }
    }

    // Perform geometry comparison
    async function performComparison(baseFeature, baseLayerIdx, compareLayerIdx) {
      clearComparisonOverlays();
      comparisonResults.innerHTML = '<div style="text-align:center; padding:20px;"><div style="border:3px solid #1976d2; border-radius:50%; border-top-color:transparent; width:30px; height:30px; animation:spin 1s linear infinite; margin:0 auto;"></div><p style="margin-top:10px;">Analyzing geometry...</p></div>';
      
      await loadComparisonData();
      
      const baseLayerLabel = LAYER_OPTIONS[baseLayerIdx].label;
      const compareLayerLabel = LAYER_OPTIONS[compareLayerIdx].label;
      const baseArea = turf.area(baseFeature);
      
      let resultsHtml = `<div style="margin-bottom:16px; padding:10px; background:#e3f0ff; border-radius:4px;">
        <strong>Base:</strong> ${baseLayerLabel}<br>
        <strong>Feature:</strong> ${baseFeature.properties[LAYER_OPTIONS[baseLayerIdx].searchField]}<br>
        <strong>Area:</strong> ${(baseArea / 1000000).toFixed(2)} sq km<br>
        <strong>Comparing with:</strong> ${compareLayerLabel}
      </div>`;
      
      const compareLayerData = comparisonLayers[compareLayerLabel];
      if (!compareLayerData || !compareLayerData.features) {
        resultsHtml += '<div style="color:#f44336;">Error: Compare layer data not available</div>';
        comparisonResults.innerHTML = resultsHtml;
        return;
      }
      
      // Find ALL features that overlap/intersect the base feature
      const overlappingFeatures = [];
      compareLayerData.features.forEach(feature => {
        try {
          const intersection = turf.intersect(baseFeature, feature);
          if (intersection) {
            const overlapArea = turf.area(intersection);
            const featureArea = turf.area(feature);
            const overlapPercent = (overlapArea / baseArea) * 100;
            const matchPercent = (overlapArea / featureArea) * 100;
            
            overlappingFeatures.push({
              feature: feature,
              overlapArea: overlapArea,
              featureArea: featureArea,
              overlapPercent: overlapPercent,
              matchPercent: matchPercent,
              intersection: intersection
            });
          }
        } catch (e) {
          console.warn('Error checking intersection:', e);
        }
      });
      
      if (overlappingFeatures.length === 0) {
        resultsHtml += '<div style="color:#666; padding:10px; background:#f5f5f5; border-radius:4px;">No overlapping features found in ' + compareLayerLabel + '</div>';
      } else {
        resultsHtml += `<div style="font-weight:600; margin:12px 0 8px 0; color:#1976d2;">Found ${overlappingFeatures.length} overlapping feature(s):</div>`;
        
        // Sort by overlap percentage (descending)
        overlappingFeatures.sort((a, b) => b.overlapPercent - a.overlapPercent);
        
        overlappingFeatures.forEach((item, idx) => {
          let matchType = 'partial-match';
          let matchLabel = 'Partial Match';
          if (item.overlapPercent > 99 && item.matchPercent > 99) {
            matchType = 'exact-match';
            matchLabel = '✓ Exact Match';
          } else if (item.overlapPercent < 50) {
            matchType = 'no-match';
            matchLabel = 'Low Overlap';
          }
          
          const featureName = item.feature.properties[LAYER_OPTIONS[compareLayerIdx].searchField] || 'Unnamed';
          resultsHtml += `<div class="comparison-result ${matchType}">
            <strong>${idx + 1}. ${featureName}</strong><br>
            <span style="font-size:0.9em; color:#666;">
              Overlap: ${item.overlapPercent.toFixed(1)}% of base<br>
              Match: ${item.matchPercent.toFixed(1)}% of feature<br>
              ${matchLabel}
            </span>
          </div>`;
        });
        
        // Visualize all overlapping features
        visualizeAllComparisons(baseFeature, overlappingFeatures, LAYER_OPTIONS[compareLayerIdx].color);
      }
      
      comparisonResults.innerHTML = resultsHtml;
    }

    // Visualize comparison on modal map
    function visualizeAllComparisons(baseFeature, overlappingFeatures, color) {
      if (!comparisonMap) return;
      
      try {
        // Show map container
        comparisonMapContainer.style.display = 'block';
        
        // Color palette for overlapping features
        const featureColors = [
          '#2196F3', // Blue
          '#9C27B0', // Purple
          '#E91E63', // Pink
          '#00BCD4', // Cyan
          '#FF5722', // Deep Orange
          '#009688', // Teal
          '#FFC107', // Amber
          '#795548', // Brown
          '#607D8B', // Blue Grey
          '#3F51B5'  // Indigo
        ];
        
        // Draw base feature with black border for easy identification
        const baseLayer = L.geoJSON(baseFeature, {
          style: {
            fillColor: '#FF9800',
            fillOpacity: 0.25,
            color: '#000000',
            weight: 6
          }
        }).bindPopup('Base Feature').addTo(comparisonMap);
        comparisonOverlays.push(baseLayer);
        
        // Draw all overlapping features from compare layer with different colors
               overlappingFeatures.forEach((item, idx) => {
          const featureColor = featureColors[idx % featureColors.length];
          const compareLayerIdx = parseInt(comparisonCompareLayer.value);
          const layerLabel = LAYER_OPTIONS[compareLayerIdx].label;
          const props = item.feature.properties;
          let popupHtml = getPopupProps(layerLabel, props);
          // Add overlap info
          popupHtml += `<br><span style='color:${featureColor};font-weight:600;'>Overlap: ${item.overlapPercent.toFixed(1)}%</span>`;
          const featureLayer = L.geoJSON(item.feature, {
            style: {
              fillColor: featureColor,
              fillOpacity: 0.3,
              color: featureColor,
              weight: 2
            }
          }).bindPopup(popupHtml).addTo(comparisonMap);
          comparisonOverlays.push(featureLayer);
          
          // Draw intersection (overlap) with hatched pattern
          if (item.intersection) {
            // Create unique pattern ID for this overlap
            const patternId = `hatch-${idx}-${Date.now()}`;
            
            // Create SVG pattern element
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.style.position = 'absolute';
            svg.style.width = '0';
            svg.style.height = '0';
            
            const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
            const pattern = document.createElementNS('http://www.w3.org/2000/svg', 'pattern');
            pattern.setAttribute('id', patternId);
            pattern.setAttribute('patternUnits', 'userSpaceOnUse');
            pattern.setAttribute('width', '8');
            pattern.setAttribute('height', '8');
            pattern.setAttribute('patternTransform', 'rotate(45)');
            
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', '0');
            line.setAttribute('y1', '0');
            line.setAttribute('x2', '0');
            line.setAttribute('y2', '8');
            line.setAttribute('stroke', featureColor);
            line.setAttribute('stroke-width', '1.5');
            
            pattern.appendChild(line);
            defs.appendChild(pattern);
            svg.appendChild(defs);
            document.body.appendChild(svg);
            
            const overlapLayer = L.geoJSON(item.intersection, {
              style: {
                fillPattern: `url(#${patternId})`,
                fillColor: featureColor,
                fillOpacity: 0.4,
                color: featureColor,
                weight: 2.5
              },
              renderer: L.svg()
            }).bindPopup(`Overlap ${idx + 1}: ${item.overlapPercent.toFixed(1)}%`).addTo(comparisonMap);
            
            // Apply pattern using direct SVG manipulation
            setTimeout(() => {
              const paths = overlapLayer._container?.querySelectorAll('path') || [];
              paths.forEach(path => {
                path.style.fill = `url(#${patternId})`;
              });
            }, 100);
            
            comparisonOverlays.push(overlapLayer);
          }
        });
        
        // Zoom to base feature bounds
        const baseLayerBounds = L.geoJSON(baseFeature);
        comparisonMap.fitBounds(baseLayerBounds.getBounds(), { padding: [50, 50], maxZoom: 14 });
        
        // Invalidate size to fix display issues
        setTimeout(() => comparisonMap.invalidateSize(), 100);
      } catch (e) {
        console.warn('Error visualizing comparison:', e);
      }
    }

    // Add spinner animation
    const style = document.createElement('style');
    style.textContent = '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
    document.head.appendChild(style);
  </script>
</body>
